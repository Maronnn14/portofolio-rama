<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skills & Expertise — Rama Adin</title>
  <meta name="description" content="Explore Rama Adin's technical skills — frontend, backend, design tools, and more. Click any skill for details." />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/lightbox.css" />
  <link rel="stylesheet" href="css/skills.css" />
  <link rel="stylesheet" href="css/admin-login.css" />
  <script>
    // Synchronously bootstrap personal data from localStorage to prevent flash-of-wrong-content
    (function() {
      var FALLBACK_PROFILE = 'https://picsum.photos/seed/ramaprofile/400/500';
      window.__personalData = {
        name: 'Rama',
        fullName: 'Rama Adin',
        role: 'Full Stack Developer',
        tagline: 'Crafting digital experiences with code & creativity',
        shortBio: 'A passionate developer who transforms ideas into elegant, functional digital solutions. With a keen eye for detail and a love for clean code, I build applications that make a difference.',
        email: 'rama@example.com',
        location: 'Indonesia',
        profileImage: FALLBACK_PROFILE
      };

      try {
        var stored = localStorage.getItem('portfolio_data_store');
        if (stored) {
          var parsed = JSON.parse(stored);
          if (parsed.personal) {
            for (var key in parsed.personal) {
              if (parsed.personal[key]) {
                window.__personalData[key] = parsed.personal[key];
              }
            }
          }
        }
      } catch(e) {
        console.error('DataStore: Failed to bootstrap head data', e);
      }

      window.__profileImageSrc = window.__personalData.photo || window.__personalData.profileImage || FALLBACK_PROFILE;

      // Dynamically update document title based on page context
      var path = window.location.pathname;
      var pageName = path.substring(path.lastIndexOf('/') + 1);
      var name = window.__personalData.fullName || 'Rama Adin';
      var role = window.__personalData.role || 'Full Stack Developer';

      if (pageName === 'about.html') {
        document.title = 'About Me — ' + name;
      } else if (pageName === 'contact.html') {
        document.title = 'Contact — ' + name;
      } else if (pageName === 'skills.html') {
        document.title = 'Skills & Expertise — ' + name;
      } else if (pageName === 'projects.html') {
        document.title = 'Projects — ' + name;
      } else if (pageName === 'project-detail.html') {
        document.title = 'Project Detail — ' + name;
      } else if (pageName === 'admin.html') {
        document.title = 'Admin Dashboard — ' + name;
      } else {
        document.title = name + ' — ' + role;
      }

      // Update meta description
      var metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) {
        metaDesc.content = role + ' crafting digital experiences with code and creativity. View my portfolio, projects, and skills.';
      }
    })();
  </script>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <!-- Page Header -->
  <header class="page-header">
    <span class="section-label" style="justify-content: center;">What I Know</span>
    <h1 class="page-header__title reveal">Skills & <span class="text-accent">Expertise</span></h1>
    <p class="page-header__subtitle reveal stagger-1">Technologies and tools I use to bring ideas to life</p>
  </header>

  <!-- Filter Tabs -->
  <section class="section--compact">
    <div class="container">
      <div class="filter-tabs reveal" id="skill-filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="Frontend">Frontend</button>
        <button class="filter-tab" data-filter="Backend">Backend</button>
        <button class="filter-tab" data-filter="Tools">Tools</button>
        <button class="filter-tab" data-filter="Design">Design</button>
      </div>

      <!-- Skills Grid -->
      <div class="skills-grid" id="skills-grid">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <!-- Skill Detail Modal -->
  <div class="skill-modal" id="skill-modal">
    <div class="skill-modal__overlay" id="skill-modal-overlay"></div>
    <div class="skill-modal__content" id="skill-modal-content">
      <!-- Rendered by JS -->
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="js/data.js"></script>
  <script src="js/admin-config.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/skills.js"></script>
</body>
</html>
